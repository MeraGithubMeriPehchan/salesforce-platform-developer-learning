<template>
    <lightning-card title="Account Search" icon-name="standard:search">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Account name"
                value={searchTerm}
                onchange={handleChange}>
            </lightning-input>
            <lightning-button
                class="slds-m-top_small"
                variant="brand"
                label="Search"
                onclick={handleSearch}>
            </lightning-button>

            <template lwc:if={hasResults}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        key-field="Id"
                        data={accounts}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>
            <template lwc:elseif={noResults}>
                <p class="slds-m-top_medium">No accounts found.</p>
            </template>
        </div>
    </lightning-card>
</template>
